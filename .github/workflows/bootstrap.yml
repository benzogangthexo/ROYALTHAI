name: bootstrap
on:
  push:
    branches: [claude/sleepy-brahmagupta-jy6nfi]
    paths: [".github/bootstrap/**", ".github/workflows/bootstrap.yml"]
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests pillow && python -m playwright install --with-deps chromium
      - run: python .github/bootstrap/site.py
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf photos-royalthai-site.tgz -C out royalthai-site
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="bootstrap-site-$GITHUB_RUN_ID" \
            -f name="bootstrap site $GITHUB_RUN_ID" -F draft=true -f target_commitish="$GITHUB_SHA" --jq .id)
          curl -sS --fail -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @photos-royalthai-site.tgz \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=photos-royalthai-site.tgz" -o /dev/null
